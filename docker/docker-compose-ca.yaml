version: '3.7'

networks:
  fabric_network:
    name: fabric_network
    external: true

services:

  # Orderer CA
  ca.orderer.example.com:
    image: hyperledger/fabric-ca:latest
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca.orderer.example.com
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_BCCSP_DEFAULT=SW
      - FABRIC_CA_SERVER_BCCSP_SW_HASH=SHA2
      - FABRIC_CA_SERVER_BCCSP_SW_SECURITY=256
      - FABRIC_CA_SERVER_CA_KEYTYPE=rsa
      - FABRIC_CA_SERVER_CA_KEYSIZE=2048
      - FABRIC_CA_SERVER_CSR_KEYREQUEST_ALGO=rsa
      - FABRIC_CA_SERVER_CSR_KEYREQUEST_SIZE=2048
      - FABRIC_CA_SERVER_TLS_KEYTYPE=rsa
      - FABRIC_CA_SERVER_TLS_KEYSIZE=2048
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/orderer:/etc/hyperledger/fabric-ca-server
    container_name: ca.orderer.example.com
    networks:
      - fabric_network

  # Org1 CA
  ca.org1.example.com:
    image: hyperledger/fabric-ca:latest
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca.org1.example.com
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7154
      - FABRIC_CA_SERVER_BCCSP_DEFAULT=SW
      - FABRIC_CA_SERVER_BCCSP_SW_HASH=SHA2
      - FABRIC_CA_SERVER_BCCSP_SW_SECURITY=256
      - FABRIC_CA_SERVER_CA_KEYTYPE=rsa
      - FABRIC_CA_SERVER_CA_KEYSIZE=2048
      - FABRIC_CA_SERVER_CSR_KEYREQUEST_ALGO=rsa
      - FABRIC_CA_SERVER_CSR_KEYREQUEST_SIZE=2048
      - FABRIC_CA_SERVER_TLS_KEYTYPE=rsa
      - FABRIC_CA_SERVER_TLS_KEYSIZE=2048
    ports:
      - "7154:7154"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/org1:/etc/hyperledger/fabric-ca-server
    container_name: ca.org1.example.com
    networks:
      - fabric_network

